<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2a5b"><title>AC Care Management</title>
<meta name="description" content="Manajemen pelanggan, jadwal cuci AC berkala, dan pengingat WhatsApp.">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website"><meta property="og:title" content="AC Care Management"><meta property="og:description" content="Jadwal cuci AC berkala dan pengingat WhatsApp."><meta property="og:image" content="assets/img/og-image.png"><meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/css/style.css"></head>
<body>
<section id="login" class="login-wrap">
<div class="login-art"><img src="assets/img/logo.svg" alt="AC Care" width="88" height="88"><h1>AC CARE</h1><p>Kelola pelanggan, jadwal cuci AC berkala, dan pengingat WhatsApp dalam satu aplikasi.</p></div>
<form id="fLogin" class="login-card"><h2>Masuk</h2><p class="muted">Gunakan akun yang diberikan admin.</p>
<label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
<label for="p">Password</label><div class="pw"><input id="p" type="password" autocomplete="current-password" required><button type="button" id="tgPw">Lihat</button></div>
<div id="lerr" class="lerr" hidden></div><button class="btn block" id="btnLogin">Masuk</button></form></section>
<div id="app" hidden><div id="scrim"></div>
<aside id="side"><div class="brand"><img src="assets/img/logo.svg" width="38" height="38" alt=""><b id="brand">AC CARE</b></div>
<nav><button data-t="dash"><i></i><span>Dashboard</span></button><button data-t="plg"><i></i><span>Pelanggan</span></button><button data-t="trx"><i></i><span>Transaksi</span></button><button data-t="jdw"><i></i><span>Jadwal</span></button><button data-t="rem"><i></i><span>Pengingat</span></button><button data-t="lap"><i></i><span>Laporan</span></button><button data-t="set"><i></i><span>Pengaturan</span></button></nav><div class="side-foot"><div id="who"></div><button id="btnOut"><i></i><span>Keluar</span></button></div></aside>
<div class="main"><header class="top"><button id="burger" aria-label="Menu">&#9776;</button><h2 id="pgTitle">Dashboard</h2></header>
<main>
<section id="dash"></section>
<section id="plg" hidden><div class="card"><h3 id="fTitle">Tambah pelanggan baru</h3><form id="fPlg">
<input type="hidden" name="id"><input name="nama" placeholder="Nama pelanggan" required><input name="whatsapp" placeholder="No. WhatsApp (08...)" required><input name="alamat" placeholder="Alamat lengkap"><input name="catatan" placeholder="Catatan pelanggan">
<label class="chk full"><input type="checkbox" name="persetujuan_wa" value="YA"> Pelanggan setuju menerima pesan WhatsApp</label>
<label class="chk full"><input type="checkbox" name="catat" value="YA" id="chkCatat" checked> Sekaligus catat pencucian / maintenance (tanpa input dua kali)</label>
<div id="fxTrx" class="full sub">
<label class="f">Tanggal pencucian<input type="date" name="tanggal"></label>
<label class="f">Jumlah unit AC<input type="number" name="unit" min="1" value="1"></label>
<label class="f">Harga per unit (Rp)<input type="number" name="harga" min="0"></label>
<label class="f">Diskon (Rp)<input type="number" name="diskon" min="0" value="0"></label>
<label class="f">Status pembayaran<select name="status_bayar"><option>LUNAS</option><option>BELUM LUNAS</option></select></label>
<label class="f">Metode pembayaran<select name="metode"><option>TUNAI</option><option>TRANSFER</option><option>QRIS</option></select></label>
<label class="f">Pencucian berikutnya<select name="interval" id="selInt"><option value="3">3 bulan</option><option value="4" selected>4 bulan</option><option value="5">5 bulan</option><option value="6">6 bulan</option><option value="custom">Atur sendiri...</option></select></label>
<label class="f" id="lblCustom" hidden>Interval (bulan)<input type="number" id="intCustom" min="1" max="60"></label>
<label class="f">Teknisi<input name="teknisi"></label><label class="f">Catatan pekerjaan<input name="catatan_kerja"></label>
<div class="total" id="total">Total: Rp 0</div><div class="total" id="prev"></div></div>
<div class="full actions"><button class="btn">Simpan</button><button type="button" class="btn ghost" id="btnBatal">Batal</button></div></form></div>
<input id="qPlg" class="search" placeholder="Cari nama / nomor WhatsApp"><div class="wrap"><table id="tPlg"></table></div><div id="riw"></div></section>
<section id="trx" hidden><div class="card"><form id="fTrx"><select id="trxS"><option value="">Semua status</option><option>LUNAS</option><option>BELUM LUNAS</option></select><input type="date" id="trxA" title="Dari"><input type="date" id="trxB" title="Sampai"><input id="trxQ" placeholder="Nama pelanggan"></form><div id="trxTot" class="total"></div></div><div class="wrap"><table id="tTrx"></table></div></section>
<section id="jdw" hidden><div class="card"><form id="fJ" onsubmit="return false"><input id="jQ" placeholder="Cari nama"><select id="jS"><option value="">Semua status</option><option>MENUNGGU</option><option>SEGERA JATUH TEMPO</option><option>PENGINGAT TERKIRIM</option><option>SUDAH DIJADWALKAN</option><option>SELESAI</option><option>DITUNDA</option><option>DIBATALKAN</option></select><input id="jM" type="month" title="Bulan"><button class="btn lt" id="jMode">Tampilan kalender</button></form></div><div id="cal" hidden></div><div class="wrap"><table id="tJdw"></table></div></section>
<section id="rem" hidden><div class="card"><form onsubmit="return false"><input id="qRem" placeholder="Cari nama / nomor WhatsApp"><button class="btn sm" id="btnCek" type="button">Jalankan cek H-2 sekarang</button></form></div><div class="wrap"><table id="tRem"></table></div></section>
<section id="lap" hidden><div class="card"><form id="fLap" onsubmit="return false"><select id="lapJ"><option value="harian">Harian</option><option value="mingguan">Mingguan</option><option value="bulanan" selected>Bulanan</option><option value="tahunan">Tahunan</option></select><input type="date" id="lapT"><button class="btn" id="btnLap">Tampilkan</button><button class="btn lt" id="btnCsv">Ekspor CSV</button><button class="btn lt" id="btnPrint">Cetak</button></form></div><div id="lapOut"></div></section>
<section id="set" hidden>
<div class="card"><b>Ganti password saya</b><form id="fPw"><input name="lama" type="password" placeholder="Password lama" required><input name="baru" type="password" placeholder="Password baru (min 8)" minlength="8" required><button class="btn">Simpan</button></form></div>
<div id="adm" hidden>
<div class="card"><b>Data usaha (tampil di invoice) &amp; WhatsApp</b><form id="fSet"><input name="nama_usaha" placeholder="Nama usaha"><input name="telp_usaha" placeholder="Telepon / WA usaha"><input name="alamat_usaha" placeholder="Alamat usaha"><input name="interval_default" type="number" min="1" max="60" placeholder="Interval default (bulan)"><textarea class="full" name="info_bayar" rows="2" placeholder="Info pembayaran di invoice, mis. Transfer BCA 123456 a.n. ..."></textarea><textarea class="full" name="template_pesan" rows="4" placeholder="Template pesan. Gunakan {nama} {tanggal} {usaha} {alamat}"></textarea><select name="wa_api_aktif"><option value="TIDAK">WhatsApp API: nonaktif (pakai tombol wa.me)</option><option value="YA">WhatsApp API: aktif (kirim otomatis)</option></select><input name="wa_template" placeholder="Nama template WhatsApp (dari Meta)"><input name="wa_lang" placeholder="Kode bahasa template, contoh: id"><button class="btn">Simpan Pengaturan</button></form><small id="waInfo"></small></div>
<div class="card"><b>Tambah akun pengguna</b><form id="fUsr"><input name="username" placeholder="Username" required><input name="nama" placeholder="Nama" required><input name="password" type="password" placeholder="Password (min 8)" required><select name="role"><option>STAFF</option><option>ADMIN</option></select><button class="btn">Tambah Akun</button></form></div>
<div class="wrap"><table id="tUsr"></table></div></div></section>
</main></div></div>
<div id="invModal" hidden><div class="inv-bar"><button class="btn sm" id="invPrint">Cetak</button><button class="btn sm lt" id="invPdf">Simpan PDF</button><button class="btn sm lt" id="invJpg">Simpan JPG</button><button class="btn sm ghost" id="invClose">Tutup</button></div><div class="inv-scroll"><div id="invoice"></div></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/app.js"></script>
</body></html>
